<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac-Aufräumer</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--accent:#0a66d8;--accent-fg:#fff;
  --danger:#d92d20;--ok:#1a7f37;--warn:#b25e00;--hover:#f0f3f8;--chip:#eef1f5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161617;--card:#222224;--fg:#f2f2f4;--muted:#9a9aa0;--line:#34343a;--accent:#3b8cff;--accent-fg:#fff;
  --danger:#ff5c4d;--ok:#3fb950;--warn:#e09b3d;--hover:#2b2d33;--chip:#2e2f34;
}}
*{box-sizing:border-box}
a{color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding-bottom:80px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px;position:sticky;top:0;z-index:5}
.hrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:650}
.lock{font-size:12px;color:var(--ok);background:var(--chip);padding:3px 9px;border-radius:99px}
.grow{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input[type=text],select,input[type=number]{font:inherit;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
nav{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
nav button{border:none;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px}
nav button.on{background:var(--chip);color:var(--fg);font-weight:600}
nav .badge{font-size:11px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 6px;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stat{font-size:26px;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:12px}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.stack{height:22px;border-radius:6px}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--hover)}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.name{font-weight:550;word-break:break-all}
.path{color:var(--muted);font-size:12px;word-break:break-all}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 18px;margin-top:12px}
.legend div{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 4px;border-radius:6px}
.legend div:hover{background:var(--hover)}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;background:var(--chip);display:block}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tcell{border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;position:relative}
.tcell.sel{border-color:var(--danger)}
.tcell img{width:100%;height:130px;object-fit:cover;border-radius:6px;background:var(--chip);display:block}
.tcell .ck{position:absolute;top:10px;left:10px;transform:scale(1.3)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:4px}
.pill.warn{color:var(--warn)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px}
.crumbs a{color:var(--accent);cursor:pointer}
.rowlink{cursor:pointer}
.progress{margin-top:12px}
.progress .bar{height:6px}
.progress .bar>span{background:var(--accent);transition:width .3s}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#selbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 24px;display:none;gap:12px;align-items:center;z-index:6;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
#selbar.show{display:flex}
#toast{position:fixed;right:20px;bottom:80px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:9;max-width:420px}
#toast.show{opacity:1}
code{background:var(--chip);padding:2px 6px;border-radius:5px;font-size:12px;user-select:all}
.empty{padding:30px;text-align:center;color:var(--muted)}
.gauge{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;background:var(--chip)}
.hint{background:var(--chip);border-radius:10px;padding:10px 14px;margin-bottom:14px}
details summary{cursor:pointer;color:var(--accent);font-size:12px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);max-width:560px;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.list-sm{max-height:200px;overflow:auto;font-size:12px;color:var(--muted);margin:10px 0;word-break:break-all}
@media (max-width:700px){header,main{padding-left:12px;padding-right:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>🧹 Mac-Aufräumer</h1>
    <span class="lock" title="Es werden keine Daten ins Internet übertragen. Der Server ist nur von diesem Mac aus erreichbar.">🔒 100 % lokal</span>
    <div class="grow"></div>
    <div id="diskmini" class="small muted"></div>
  </div>
  <div class="hrow" style="margin-top:12px">
    <input type="text" id="root" placeholder="Ordner (leer = Benutzerordner)" style="width:260px">
    <label class="chk" title="Sucht auch in ~/Library und versteckten Ordnern nach Duplikaten (dort liegen meist App-Daten – mit Vorsicht löschen)"><input type="checkbox" id="optlib"> Duplikate auch in App-Daten</label>
    <label class="chk" title="Vergleicht Bilder optisch (z. B. gleiche Fotos in anderer Größe). Dauert länger."><input type="checkbox" id="optsim" checked> Ähnliche Bilder suchen</label>
    <label class="chk">Duplikate ab <input type="number" id="optmin" value="100" min="1" style="width:70px"> KB</label>
    <button class="primary" id="btnscan">Scan starten</button>
    <button id="btncancel" style="display:none">Abbrechen</button>
  </div>
  <div class="progress" id="progress" style="display:none">
    <div class="small" id="pmsg" style="margin-bottom:5px"><span id="pphase"></span> <span class="muted ellip" id="ppath"></span></div>
    <div class="bar"><span id="pbar" style="width:0"></span></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>

<div id="selbar">
  <b id="selinfo"></b>
  <div class="grow"></div>
  <button id="selclear">Auswahl aufheben</button>
  <button class="danger" id="seltrash">In den Papierkorb</button>
</div>
<div id="toast"></div>
<dialog id="dlg"><div id="dlgbody"></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button id="dlgno">Abbrechen</button><button class="danger" id="dlgyes">Ja</button></div></dialog>

<script>
"use strict";
const T = new URLSearchParams(location.search).get("t") || "";
const $ = s => document.querySelector(s);
const COLORS = {"Bilder":"#e8590c","Videos":"#c2255c","Musik & Audio":"#9c36b5","Dokumente":"#1971c2","Archive & Installer":"#f08c00",
  "Programme":"#2f9e44","Code & Entwicklung":"#0c8599","App-Daten & Caches":"#868e96","Versteckte Ordner":"#5c7cfa","Papierkorb":"#e03131","Sonstiges":"#adb5bd"};
const CAT_HELP = {"Bilder":"Fotos und Grafiken in deinen Ordnern (inkl. Fotos-Mediathek)","Videos":"Filme, Bildschirmaufnahmen, iMovie-Projekte",
  "Musik & Audio":"Musik, Sprachmemos, GarageBand/Logic-Projekte","Dokumente":"PDFs, Office, Pages, Texte","Archive & Installer":"ZIP-Dateien, DMG-/PKG-Installer, Disk-Images",
  "Programme":"Apps im Benutzerordner (Apps in /Programme siehe Reiter „Programme“)","Code & Entwicklung":"Quellcode, Datenbanken, Bibliotheken",
  "App-Daten & Caches":"~/Library: Einstellungen, Caches, Mail, Nachrichten, App-Container, Backups","Versteckte Ordner":"Unsichtbare Ordner wie .npm, .docker, .cache",
  "Papierkorb":"Bereits gelöschte Dateien – erst nach dem Leeren ist der Platz frei","Sonstiges":"Alles ohne bekannte Dateiendung"};

let R = null, tab = "overview", sel = new Map(), sys = null, folderPath = null;
const fstate = {cat:"", q:"", age:"0", min:"0"};
let dupFilter = "";

async function api(path, body){
  const o = {headers:{"X-Token":T}};
  if(body!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  const r = await fetch(path,o);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function fmt(b){ if(b==null) return "–"; const u=["B","KB","MB","GB","TB"]; let i=0; while(b>=1000&&i<4){b/=1000;i++;} return (i?b.toFixed(b<10?1:0):b)+" "+u[i]; }
function fdate(ts){ return ts? new Date(ts*1000).toLocaleDateString("de-DE",{year:"numeric",month:"short",day:"numeric"}) : "–"; }
function ago(ts){ if(!ts) return "unbekannt"; const d=(Date.now()/1000-ts)/86400; if(d<1) return "heute"; if(d<2) return "gestern"; if(d<60) return "vor "+Math.round(d)+" Tagen"; if(d<730) return "vor "+Math.round(d/30)+" Monaten"; return "vor "+Math.round(d/365)+" Jahren"; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function base(p){ return p.split("/").filter(Boolean).pop()||p; }
function dir(p){ const i=p.lastIndexOf("/"); return i>0?p.slice(0,i):"/"; }
function short(p){ const h = R&&R.home; return p; }
function isImg(p){ return /\.(jpe?g|png|gif|heic|heif|tiff?|bmp|webp|dng|cr2|cr3|nef|arw|orf|rw2|raf|psd)$/i.test(p); }
function thumb(p, cls){ return isImg(p)? `<img class="${cls||"thumb"}" loading="lazy" src="/api/thumb?t=${encodeURIComponent(T)}&p=${encodeURIComponent(p)}" onerror="this.style.visibility='hidden'">` : ""; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),4000); }
function confirmDlg(html, yes){ return new Promise(res=>{ $("#dlgbody").innerHTML=html; $("#dlgyes").textContent=yes||"Ja"; const d=$("#dlg"); d.showModal(); $("#dlgyes").onclick=()=>{d.close();res(true)}; $("#dlgno").onclick=()=>{d.close();res(false)}; }); }

// ---------- Auswahl ----------
function selToggle(p,s,on){ if(on===undefined) on=!sel.has(p); if(on) sel.set(p,s); else sel.delete(p); updSel(); }
function updSel(){ const n=sel.size; let t=0; sel.forEach(v=>t+=v); $("#selinfo").textContent = n+" ausgewählt · "+fmt(t); $("#selbar").classList.toggle("show",n>0); }
function ck(p,s){ return `<input type="checkbox" data-p="${esc(p)}" data-s="${s}" ${sel.has(p)?"checked":""}>`; }
document.addEventListener("change", e=>{ const c=e.target; if(c.matches("input[type=checkbox][data-p]")){ selToggle(c.dataset.p, +c.dataset.s, c.checked); const cell=c.closest(".tcell"); if(cell) cell.classList.toggle("sel",c.checked);} });
document.addEventListener("click", e=>{
  const r=e.target.closest("[data-reveal]"); if(r){ e.stopPropagation(); api("/api/reveal",{path:r.dataset.reveal}); return; }
  const o=e.target.closest("[data-open]"); if(o){ api("/api/open",{what:o.dataset.open}); return; }
  const f=e.target.closest("[data-folder]"); if(f && !e.target.closest("input,button")){ openFolder(f.dataset.folder); return; }
  const g=e.target.closest("[data-go]"); if(g){ if(g.dataset.cat!==undefined) fstate.cat=g.dataset.cat; if(g.dataset.q!==undefined) fstate.q=g.dataset.q; setTab(g.dataset.go); return; }
  const tc=e.target.closest(".tcell"); if(tc && !e.target.closest("input,button")){ const c=tc.querySelector("input[data-p]"); c.checked=!c.checked; c.dispatchEvent(new Event("change",{bubbles:true})); }
});
$("#selclear").onclick=()=>{ sel.clear(); updSel(); render(); };
$("#seltrash").onclick=async()=>{
  const paths=[...sel.keys()]; let total=0; sel.forEach(v=>total+=v);
  let warn="";
  if(R){ const all=[...(R.dups||[]),...(R.similar||[])].filter(g=>g.files.every(f=>sel.has(f.p))); if(all.length) warn=`<p style="color:var(--danger)"><b>Achtung:</b> In ${all.length} Duplikat-Gruppe(n) sind <b>alle</b> Kopien ausgewählt – dann bleibt keine übrig!</p>`; }
  const big=paths.filter(p=>p.endsWith(".app")).length;
  const ok = await confirmDlg(`<h3>${paths.length} Objekt(e) in den Papierkorb legen?</h3><p>Das gibt etwa <b>${fmt(total)}</b> frei, sobald du den Papierkorb leerst. Bis dahin kannst du alles im Finder mit „Zurücklegen“ wiederherstellen.</p>${big?`<p class="muted">Bei Programmen ggf. vorher die App beenden. Für Apps in /Programme fragt macOS evtl. nach deinem Passwort.</p>`:""}${warn}<div class="list-sm">${paths.slice(0,60).map(esc).join("<br>")}${paths.length>60?"<br>…":""}</div>`, "In den Papierkorb");
  if(!ok) return;
  $("#seltrash").disabled=true;
  try{
    const res=await api("/api/trash",{paths});
    res.ok.forEach(p=>sel.delete(p));
    if(res.failed.length) await confirmDlg(`<h3>${res.failed.length} Objekt(e) konnten nicht verschoben werden</h3><div class="list-sm">${res.failed.map(f=>esc(f.p)+" – "+esc(f.err)).join("<br>")}</div><p class="muted small">Tipp: Erlaube dem Terminal unter Systemeinstellungen → Datenschutz & Sicherheit → Automation den Zugriff auf „Finder“.</p>`,"OK");
    toast(`${res.ok.length} Objekt(e) im Papierkorb · ${fmt(res.freed)}`);
    await loadResults(); updSel(); refreshDisk();
  }catch(err){ toast("Fehler: "+err.message); }
  $("#seltrash").disabled=false;
};

// ---------- Tabs ----------
const TABS=[["overview","Übersicht"],["files","Größte Dateien"],["folders","Ordner"],["apps","Programme"],["dups","Duplikate"],["similar","Ähnliche Bilder"],["tips","Aufräum-Tipps"],["system","Leistung"]];
function renderTabs(){
  const badge={dups:R&&R.dups.length,similar:R&&R.similar.length,tips:R&&R.tips.filter(t=>t.s>0).length};
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}">${l}${badge[k]?`<span class="badge">${badge[k]}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
function setTab(k){ tab=k; renderTabs(); render(); window.scrollTo(0,0); }
function render(){
  const m=$("#main");
  if(tab==="system") return renderSystem();
  if(!R){ m.innerHTML=`<div class="card"><h2>Willkommen!</h2><p>Klicke oben auf <b>„Scan starten“</b>. Der Mac-Aufräumer durchsucht deinen Benutzerordner und zeigt dir anschließend:</p>
    <ul><li>wofür dein Speicher draufgeht (Bilder, Videos, Dokumente, App-Daten …)</li><li>die größten Dateien, Ordner und Programme</li><li>doppelte Dateien und ähnliche Fotos</li><li>konkrete Aufräum-Tipps (Caches, Downloads, Installer, Backups …)</li></ul>
    <p class="muted">🔒 Alles bleibt auf deinem Mac. Nichts wird hochgeladen. Gelöschtes landet im Papierkorb und lässt sich wiederherstellen.</p>
    <p class="muted small">macOS fragt beim ersten Scan evtl., ob das Terminal auf Schreibtisch, Dokumente, Downloads usw. zugreifen darf – bitte erlauben. Für einen vollständigen Scan: Systemeinstellungen → Datenschutz & Sicherheit → Festplattenvollzugriff → Terminal aktivieren.</p></div>
    <p class="muted small">Den Reiter <a href="#" data-go="system">„Leistung“</a> kannst du auch ohne Scan ansehen.</p>`; return; }
  ({overview:renderOverview,files:renderFiles,folders:renderFolders,apps:renderApps,dups:renderDups,similar:renderSimilar,tips:renderTips})[tab]();
}

// ---------- Übersicht ----------
function renderOverview(){
  const d=sys&&sys.disk, cats=R.categories, tot=cats.reduce((a,c)=>a+c.size,0)||1;
  const dupW=R.dups.reduce((a,g)=>a+g.waste,0), simW=R.similar.reduce((a,g)=>a+g.waste,0);
  const tip=id=>R.tips.find(t=>t.id===id);
  const quick=[["Doppelte Dateien",dupW,"dups"],["Ähnliche Bilder",simW,"similar"],["Papierkorb",(tip("trash")||{}).s,"tips"],["Downloads",(tip("downloads")||{}).s,"tips"],
    ["App-Caches",(tip("caches")||{}).s,"tips"],["Installer (.dmg/.pkg)",(tip("installers")||{}).s,"tips"]].filter(q=>q[1]>0);
  const root=folderView0();
  let h=`<div class="grid">`;
  if(d){ const pct=d.used/d.total*100; h+=`<div class="card"><h3>Festplatte</h3><div class="stat">${fmt(d.free)} frei</div><div class="muted small" style="margin-bottom:8px">von ${fmt(d.total)} · ${pct.toFixed(0)} % belegt</div><div class="bar"><span style="width:${pct}%;background:${pct>90?"var(--danger)":pct>80?"var(--warn)":"var(--accent)"}"></span></div>${pct>85?`<p class="small" style="color:var(--warn)">⚠️ Wenig freier Speicher bremst den Mac (Auslagerung, Updates). Ziel: mind. 15–20 % frei.</p>`:""}</div>`; }
  h+=`<div class="card"><h3>Gescannt</h3><div class="stat">${fmt(R.total)}</div><div class="muted small">${R.files.toLocaleString("de-DE")} Dateien in ${esc(R.root)} · ${R.duration} s</div>${R.perm_errors?`<p class="small" style="color:var(--warn)">${R.perm_errors} Ordner ohne Zugriff. <details><summary>Details</summary>${R.perm_paths.map(esc).join("<br>")}<br>→ Festplattenvollzugriff für Terminal aktivieren und neu scannen.</details></p>`:""}</div>`;
  h+=`<div class="card"><h3>Schnell freizumachen</h3>${quick.length?quick.map(q=>`<div class="rowlink" data-go="${q[2]}" style="display:flex;padding:3px 0"><span>${q[0]}</span><b style="margin-left:auto">${fmt(q[1])}</b></div>`).join(""):`<p class="muted">Nichts Auffälliges gefunden 👍</p>`}</div></div>`;
  h+=`<div class="card"><h2>Wofür wird der Platz verwendet?</h2><div class="bar stack">${cats.map(c=>`<span title="${esc(c.name)}: ${fmt(c.size)}" style="width:${c.size/tot*100}%;background:${COLORS[c.name]||"#999"}"></span>`).join("")}</div>
    <div class="legend">${cats.map(c=>`<div data-go="files" data-cat="${esc(c.name)}" title="${esc(CAT_HELP[c.name]||"")}"><span class="dot" style="background:${COLORS[c.name]||"#999"}"></span>${esc(c.name)} <span class="muted small">${c.count.toLocaleString("de-DE")}</span><b>${fmt(c.size)}</b></div>`).join("")}</div>
    <p class="muted small" style="margin-bottom:0">Klicke auf eine Kategorie, um die größten Dateien darin zu sehen. Fahre mit der Maus darüber für eine Erklärung.</p></div>`;
  h+=`<div class="grid"><div class="card"><h2>Größte Ordner</h2>${root.slice(0,10).map(k=>`<div class="rowlink" data-folder="${esc(k.p)}" style="padding:4px 0"><div style="display:flex"><span class="ellip">📁 ${esc(base(k.p))}</span><b style="margin-left:auto">${fmt(k.s)}</b></div><div class="bar" style="height:4px;margin-top:3px"><span style="width:${k.s/(root[0].s||1)*100}%;background:var(--accent)"></span></div></div>`).join("")}</div>
    <div class="card"><h2>Größte Programme</h2>${R.apps.slice(0,10).map(a=>`<div class="rowlink" data-go="apps" style="display:flex;padding:4px 0"><span class="ellip">${esc(a.name)}</span><b style="margin-left:auto">${fmt(a.s+a.rs)}</b></div>`).join("")||`<p class="muted">Keine gefunden.</p>`}</div></div>`;
  $("#main").innerHTML=h;
}
let rootKids=[];
function folderView0(){ return rootKids; }

// ---------- Größte Dateien ----------
function renderFiles(){
  const cats=[...new Set(R.top_files.map(f=>f.c))].sort();
  const now=Date.now()/1000, age=+fstate.age*365*86400, min=+fstate.min*1e6, q=fstate.q.toLowerCase();
  const list=R.top_files.filter(f=>(!fstate.cat||f.c===fstate.cat)&&(!q||f.p.toLowerCase().includes(q))&&(!age||now-f.m>age)&&f.s>=min);
  const sum=list.reduce((a,f)=>a+f.s,0);
  let h=`<div class="card"><div class="toolbar">

  <td class="hide-sm"><div class="bar" style="height:6px"><span style="width:${k.s/max*100}%;background:var(--accent)"></span></div></td><td class="num"><b>${fmt(k.s)}</b></td><td class="num hide-sm muted">${(k.s/(v.size||1)*100).toFixed(1)} %</td>
  <td class="num"><button class="small" data-reveal="${esc(k.p)}">Finder</button></td></tr>`).join("")}
  ${v.direct.n?`<tr><td></td><td class="muted">📄 ${v.direct.n.toLocaleString("de-DE")} Dateien direkt in diesem Ordner</td><td class="hide-sm"></td><td class="num">${fmt(v.direct.s)}</td><td class="num hide-sm muted">${(v.direct.s/(v.size||1)*100).toFixed(1)} %</td><td></td></tr>`:""}

  const waste=groups.reduce((a,g)=>a+g.waste,0);
  let h=`<div class="card"><div class="toolbar"><b>${groups.length} Gruppen doppelter Dateien</b> · <span>${fmt(waste)} könnten frei werden</span><div class="grow"></div>

    <p class="muted small" style="margin-top:0">Diese Dateien sind <b>byte-genau identisch</b> (Prüfsumme verglichen). Ausgenommen: Fotos-Mediathek, Papierkorb${R.root_is_home&&!$("#optlib").checked?", ~/Library und versteckte Ordner":""}.</p>

    <table>${g.files.map((f,i)=>`<tr><td style="width:28px">${ck(f.p,g.size)}</td><td><div class="path" style="color:var(--fg)">${esc(f.p)}</div></td><td class="num small muted">${fdate(f.m)}${i===0?` <span class="pill">ältestes</span>`:""}</td><td class="num"><button class="small" data-reveal="${esc(f.p)}">Finder</button></td></tr>`).join("")}</table></div>`).join("");

// ---------- Leistung ----------
async function renderSystem(){
  const m=$("#main"); if(!sys) m.innerHTML=`<div class="card empty">Lade Systeminfos …</div>`;
  sys=await api("/api/system"); if(tab!=="system") return;
  const s=sys, mt=s.mem_total, mem=s.mem;
  let h=`<div class="toolbar"><button data-open="activity">Aktivitätsanzeige öffnen</button><button data-open="loginitems">Anmeldeobjekte öffnen</button><button data-open="storage">Speicher-Einstellungen</button><div class="grow"></div><button id="sysref">Aktualisieren</button></div><div class="grid">`;
  if(mem&&mt){ const app=mem.active+mem.wired+mem.compressed; const parts=[["Fest belegt (System)",mem.wired,"#e03131"],["Aktiv",mem.active,"#f08c00"],["Komprimiert",mem.compressed,"#9c36b5"],["Inaktiv/Cache",mem.inactive,"#74c0fc"]];
    h+=`<div class="card"><h3>Arbeitsspeicher (RAM)</h3><div class="stat">${fmt(app)} <span class="muted" style="font-size:14px">von ${fmt(mt)} genutzt</span></div><div class="gauge" style="margin:8px 0">${parts.map(p=>`<span title="${p[0]}: ${fmt(p[1])}" style="width:${p[1]/mt*100}%;background:${p[2]}"></span>`).join("")}</div>
    <div class="small muted">${parts.map(p=>`<span class="dot" style="background:${p[2]}"></span>${p[0]} ${fmt(p[1])}`).join(" &nbsp; ")}</div>
    ${s.mem_free_pct!=null?`<p class="small">Speicherdruck: <b style="color:${s.mem_free_pct<20?"var(--danger)":s.mem_free_pct<40?"var(--warn)":"var(--ok)"}">${s.mem_free_pct<20?"hoch":s.mem_free_pct<40?"mittel":"niedrig"}</b> (${s.mem_free_pct} % frei)</p>`:""}
    ${s.swap_used!=null?`<p class="small">Ausgelagert (Swap): <b>${fmt(s.swap_used)}</b>${s.swap_used>2e9?` – <span style="color:var(--warn)">viel! Schließe ungenutzte Programme/Tabs.</span>`:""}</p>`:""}</div>`; }
  else if(mt) h+=`<div class="card"><h3>Arbeitsspeicher</h3><div class="stat">${fmt(mt)}</div></div>`;
  if(s.load) h+=`<div class="card"><h3>Prozessor</h3><div class="stat">${(s.load[0]/(s.cpus||1)*100).toFixed(0)} %</div><div class="small muted">Auslastung (1 Min.) · ${s.cpus} Kerne · ${s.nproc} Prozesse</div>${s.uptime?`<p class="small">Läuft seit <b>${Math.floor(s.uptime/86400)} Tagen</b>${s.uptime>14*86400?` – <span style="color:var(--warn)">ein Neustart kann Speicher freigeben und den Mac spürbar beschleunigen.</span>`:""}</p>`:""}${s.os?`<p class="small muted">macOS ${esc(s.os)}</p>`:""}</div>`;
  if(s.disk){ const pct=s.disk.used/s.disk.total*100; h+=`<div class="card"><h3>Speicherplatz</h3><div class="stat">${fmt(s.disk.free)} frei</div><div class="bar" style="margin:8px 0"><span style="width:${pct}%;background:${pct>90?"var(--danger)":pct>80?"var(--warn)":"var(--accent)"}"></span></div><div class="small muted">${pct.toFixed(0)} % von ${fmt(s.disk.total)} belegt</div></div>`; }
  h+=`</div><div class="grid"><div class="card"><h2>Größte RAM-Verbraucher</h2>${procTable(s.by_mem,"rss")}</div><div class="card"><h2>Größte CPU-Verbraucher</h2>${procTable(s.by_cpu,"cpu")}</div></div>`;
  h+=`<div class="card"><h2>Hintergrund- & Startobjekte (${s.agents.length})</h2><p class="muted small" style="margin-top:0">Programme, die automatisch im Hintergrund starten. Viele davon (z. B. Updater) kosten Leistung beim Start. Ein- und ausschalten am sichersten unter <a href="#" data-open="loginitems">Systemeinstellungen → Allgemein → Anmeldeobjekte</a>. Einträge von Apps, die du gelöscht hast, sind Reste und können in den Papierkorb (danach neu starten).</p>
  ${s.agents.length?`<table><tr><th style="width:28px"></th><th>Name</th><th class="hide-sm">Art</th><th></th></tr>${s.agents.map(a=>`<tr><td>${a.scope==="Benutzer"?ck(a.p,0):""}</td><td><div class="name">${esc(a.label)}${a.disabled?`<span class="pill">deaktiviert</span>`:""}${a.label.startsWith("com.apple.")?`<span class="pill">Apple</span>`:""}</div><div class="path">${esc(a.prog||a.p)}</div></td><td class="hide-sm muted small">${esc(a.scope)}</td><td class="num"><button class="small" data-reveal="${esc(a.p)}">Finder</button></td></tr>`).join("")}</table>`:`<div class="empty">Keine gefunden.</div>`}</div>`;
  h+=`<div class="card"><h2>Tipps für mehr Tempo</h2><ul>
   <li><b>Mindestens 15–20 % Speicher frei lassen</b> – macOS braucht Platz für Auslagerung, Caches und Updates.</li>
   <li><b>Regelmäßig neu starten</b> (alle 1–2 Wochen) – räumt Arbeitsspeicher und hängende Prozesse auf.</li>
   <li><b>Browser-Tabs reduzieren</b> – jeder Tab ist ein eigener Prozess und kann hunderte MB belegen.</li>
   <li><b>Anmeldeobjekte ausmisten</b> – weniger Programme beim Start = schnellerer Start, mehr freier RAM.</li>
   <li><b>macOS & Apps aktuell halten</b> (Softwareupdate) – Updates bringen oft Leistungsverbesserungen.</li>
   <li><b>Spotlight</b> indiziert nach großen Änderungen eine Weile – das ist normal und geht vorbei.</li>
   <li>Sehr hoher Swap/Speicherdruck trotz wenig offener Apps → in der Aktivitätsanzeige nach „Speicher“ sortieren.</li></ul></div>`;
  m.innerHTML=h; $("#sysref").onclick=()=>renderSystem(); updDiskMini();
}
function procTable(list,key){ const max=list.length?list[0][key]:1;
  return `<table>${list.map(a=>`<tr><td><div class="name">${esc(a.app)}${a.n>1?` <span class="muted small">(${a.n} Prozesse)</span>`:""}</div><div class="bar" style="height:4px;margin-top:3px"><span style="width:${a[key]/(max||1)*100}%;background:var(--accent)"></span></div></td><td class="num"><b>${key==="rss"?fmt(a.rss):a.cpu.toFixed(1)+" %"}</b></td><td class="num muted small hide-sm">${key==="rss"?a.cpu.toFixed(1)+" %":fmt(a.rss)}</td></tr>`).join("")}</table>`; }

const PHASES={scan:"Durchsuche Dateien …",apps:"Programme …",dups:"Prüfe Duplikate …",similar:"Vergleiche Bilder …",tips:"Suche Tipps …"};
async function poll(){
  let s; try{ s=await api("/api/status"); }catch(e){ $("#pphase").textContent="Verbindung zum Mac-Aufräumer verloren – läuft das Terminal-Fenster noch?"; return; }
  const running=s.running;
  $("#progress").style.display=running?"block":"none"; $("#btncancel").style.display=running?"":"none"; $("#btnscan").disabled=running;
  if(running){ $("#pphase").innerHTML=`<b>${PHASES[s.phase]||""}</b> ${s.files.toLocaleString("de-DE")} Dateien · ${fmt(s.bytes)}`; $("#ppath").textContent=s.message||"";
    $("#pbar").style.width=(s.progress==null?100:s.progress*100)+"%"; $("#pbar").style.opacity=s.progress==null?.35:1; setTimeout(poll,700); }
  else { if(poll.wasRunning){ if(s.phase==="done"){ await loadResults(); toast(s.message);} else toast(s.message); } }
  poll.wasRunning=running;
}
$("#btnscan").onclick=async()=>{ sel.clear(); updSel(); folderPath=null;
  await api("/api/scan",{root:$("#root").value.trim(),include_library:$("#optlib").checked,similar:$("#optsim").checked,min_dup_kb:+$("#optmin").value||100});
  poll.wasRunning=true; setTimeout(poll,200); };
$("#btncancel").onclick=()=>api("/api/cancel",{});

renderTabs(); render(); refreshDisk(); loadResults().then(poll);
</script>
